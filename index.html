<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Produção</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #020817;
    color: white;
}

.container {
    width: 100%;
    padding: 18px;
}

/* ================= CABEÇALHO ================= */

.header {
    background: #111a2d;
    border: 1px solid #263451;
    border-radius: 16px;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.titulo {
    font-size: 28px;
    font-weight: bold;
    color: #60a5fa;
}

.subtitulo {
    margin-top: 5px;
    color: #94a3b8;
    font-size: 14px;
}

.cards-topo {
    display: flex;
    gap: 12px;
}

.card {
    min-width: 130px;
    background: #172238;
    border: 1px solid #34425c;
    border-radius: 12px;
    padding: 12px 18px;
    text-align: center;
}

.card-titulo {
    font-size: 12px;
    color: #94a3b8;
}

.card-valor {
    font-size: 23px;
    font-weight: bold;
    margin-top: 5px;
}

.azul {
    color: #60a5fa;
}

.verde {
    color: #22c55e;
}

.amarelo {
    color: #facc15;
}

.vermelho {
    color: #ef4444;
}

/* ================= STATUS ================= */

.status-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.status-card {
    background: #111a2d;
    border-radius: 12px;
    border: 1px solid #263451;
    padding: 12px;
    text-align: center;
}

.status-card strong {
    display: block;
    font-size: 12px;
    color: #94a3b8;
}

.status-card span {
    font-size: 26px;
    font-weight: bold;
}

/* ================= MÁQUINAS ================= */

.linha {
    margin-bottom: 18px;
}

.linha-titulo {
    background: #172238;
    border: 1px solid #34425c;
    border-radius: 10px 10px 0 0;
    padding: 9px 15px;
    font-size: 18px;
    font-weight: bold;
    color: #e2e8f0;
}

.maquinas {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    background: #070f20;
    padding: 10px;
    border: 1px solid #263451;
    border-top: none;
}

/* ================= MÁQUINA ================= */

.maquina {
    background: #101a2d;
    border: 1px solid #334155;
    border-radius: 8px;
    overflow: hidden;
    min-height: 170px;
}

.maquina-titulo {
    background: #8fbd7b;
    color: #07130a;
    text-align: center;
    font-weight: bold;
    padding: 8px;
    font-size: 15px;
}

.tabela {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}

.tabela th {
    background: #e5e7eb;
    color: #111827;
    padding: 5px;
}

.tabela td {
    padding: 6px 4px;
    border-bottom: 1px solid #334155;
    text-align: center;
    color: #e2e8f0;
}

.tabela tr:last-child td {
    border-bottom: none;
}

.codigo {
    font-weight: bold;
    color: #fff;
    text-align: left !important;
}

.falta {
    color: #facc15 !important;
}

/* ================= STATUS DA LINHA ================= */

.produzindo {
    background: rgba(34,197,94,0.15);
}

.programar {
    background: rgba(250,204,21,0.14);
}

.finalizado {
    background: rgba(239,68,68,0.14);
}

.parada {
    background: rgba(59,130,246,0.15);
}

.sem-status {
    background: rgba(100,116,139,0.08);
}

.status-text {
    font-weight: bold;
}

.status-produzindo {
    color: #22c55e !important;
}

.status-programar {
    color: #facc15 !important;
}

.status-finalizado {
    color: #ef4444 !important;
}

.status-parada {
    color: #60a5fa !important;
}

/* ================= LOADING ================= */

.loading {
    text-align: center;
    padding: 80px;
    color: #94a3b8;
    font-size: 20px;
}

.erro {
    background: #450a0a;
    color: #fecaca;
    border: 1px solid #991b1b;
    border-radius: 10px;
    padding: 20px;
    margin: 20px;
}

/* ================= RESPONSIVO ================= */

@media(max-width: 1200px) {

    .header {
        flex-direction: column;
        gap: 15px;
    }

    .maquinas {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 800px) {

    .maquinas {
        grid-template-columns: repeat(2, 1fr);
    }

    .status-bar {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <div class="titulo">
                🏭 CONTROLE DE PROGRAMAÇÃO E PRODUÇÃO
            </div>

            <div class="subtitulo">
                Painel Operacional • Atualização automática
            </div>
        </div>

        <div class="cards-topo">

            <div class="card">
                <div class="card-titulo">
                    TOTAL PRODUZIDO
                </div>

                <div class="card-valor azul" id="totalProduzido">
                    0
                </div>
            </div>

            <div class="card">
                <div class="card-titulo">
                    DATA
                </div>

                <div class="card-valor verde" id="dataAtual">
                    --
                </div>
            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div class="status-bar">

        <div class="status-card">
            <strong>🟢 PRODUZINDO</strong>
            <span class="verde" id="qtdProduzindo">0</span>
        </div>

        <div class="status-card">
            <strong>🟡 PROGRAMAR</strong>
            <span class="amarelo" id="qtdProgramar">0</span>
        </div>

        <div class="status-card">
            <strong>🔴 FINALIZADO</strong>
            <span class="vermelho" id="qtdFinalizado">0</span>
        </div>

        <div class="status-card">
            <strong>🔵 PARADA</strong>
            <span class="azul" id="qtdParada">0</span>
        </div>

    </div>


    <!-- PAINEL -->

    <div id="painel">

        <div class="loading">
            ⏳ Carregando dados da produção...
        </div>

    </div>

</div>


<script>

/* =====================================================
   URL DO SEU GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbw0JKSWHRd8sed1zn9EolPGEqAV4b8h9cC8ef_BadKxrU43Dgqx8mq543Umg6VWRF3Z_Q/exec";


/* =====================================================
   CARREGAR DADOS
===================================================== */

async function carregarDados() {

    try {

        const resposta = await fetch(API_URL);

        if (!resposta.ok) {
            throw new Error("Erro ao acessar a API");
        }

        const dados = await resposta.json();

        console.log("Dados recebidos:", dados);

        montarPainel(dados);

    }

    catch (erro) {

        console.error(erro);

        document.getElementById("painel").innerHTML = `
            <div class="erro">
                ❌ Não foi possível carregar os dados da produção.
                <br><br>
                Verifique se o Google Apps Script está publicado
                como "Qualquer pessoa".
            </div>
        `;

    }

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .trim()
        .toUpperCase();

}


/* =====================================================
   MONTAR PAINEL
===================================================== */

function montarPainel(dados) {

    if (!Array.isArray(dados)) {

        document.getElementById("painel").innerHTML =
            "<div class='erro'>A API não retornou uma lista de dados.</div>";

        return;
    }


    /* ---------------------------------------------
       DATA
    --------------------------------------------- */

    const hoje = new Date();

    document.getElementById("dataAtual").innerText =
        hoje.toLocaleDateString("pt-BR");


    /* ---------------------------------------------
       TOTAL PRODUZIDO
    --------------------------------------------- */

    let totalProduzido = 0;

    dados.forEach(item => {

        let produzido =
            Number(item.PRODUZIDO) ||
            Number(item["PRODUZIDO"]) ||
            0;

        totalProduzido += produzido;

    });

    document.getElementById("totalProduzido").innerText =
        totalProduzido.toLocaleString("pt-BR");


    /* ---------------------------------------------
       CONTADORES
    --------------------------------------------- */

    let produzindo = 0;
    let programar = 0;
    let finalizado = 0;
    let parada = 0;


    dados.forEach(item => {

        const status =
            normalizar(item.STATUS);

        if (status === "PRODUZINDO") {
            produzindo++;
        }

        else if (status === "PROGRAMAR") {
            programar++;
        }

        else if (status === "FINALIZADO") {
            finalizado++;
        }

        else if (
            status === "PARADA" ||
            status === "PARADO"
        ) {
            parada++;
        }

    });


    document.getElementById("qtdProduzindo").innerText =
        produzindo;

    document.getElementById("qtdProgramar").innerText =
        programar;

    document.getElementById("qtdFinalizado").innerText =
        finalizado;

    document.getElementById("qtdParada").innerText =
        parada;


    /* ---------------------------------------------
       AGRUPAR POR MÁQUINA
    --------------------------------------------- */

    const maquinas = {};


    dados.forEach(item => {

        let maquina =
            item.MAQUINA ||
            item["MÁQUINA"] ||
            "";

        maquina = normalizar(maquina);

        if (!maquina) {
            return;
        }

        if (!maquinas[maquina]) {
            maquinas[maquina] = [];
        }

        maquinas[maquina].push(item);

    });


    /* ---------------------------------------------
       CRIAR PAINEL
    --------------------------------------------- */

    let html = "";


    const numeroMaquinas = 20;


    for (let inicio = 1; inicio <= numeroMaquinas; inicio += 5) {

        const fim = Math.min(inicio + 4, numeroMaquinas);


        html += `
            <div class="linha">

                <div class="linha-titulo">
                    🏭 LINHA ${inicio <= 10 ? "1" : inicio <= 15 ? "2" : "3"}
                </div>

                <div class="maquinas">
        `;


        for (let numero = inicio; numero <= fim; numero++) {

            const nomeMaquina = "M" + numero;

            const registros =
                maquinas[nomeMaquina] || [];


            html += criarMaquina(
                numero,
                registros
            );

        }


        html += `
                </div>
            </div>
        `;

    }


    document.getElementById("painel").innerHTML = html;

}


/* =====================================================
   CRIAR CARD DA MÁQUINA
===================================================== */

function criarMaquina(numero, registros) {

    let html = `

        <div class="maquina">

            <div class="maquina-titulo">
                🏭 MÁQUINA ${numero}
            </div>

            <table class="tabela">

                <thead>

                    <tr>
                        <th>%</th>
                        <th>CÓDIGO</th>
                        <th>FALTA</th>
                        <th>STATUS</th>
                    </tr>

                </thead>

                <tbody>
    `;


    /* Máquina sem produção */

    if (registros.length === 0) {

        for (let i = 0; i < 4; i++) {

            html += `
                <tr class="sem-status">
                    <td>-</td>
                    <td class="codigo"></td>
                    <td></td>
                    <td></td>
                </tr>
            `;

        }

    }


    /* Máquina com produção */

    else {

        registros.slice(0, 5).forEach(item => {

            const codigo =
                item.CODIGO ||
                item["CÓDIGO"] ||
                "";


            const falta =
                item.FALTA !== undefined
                    ? item.FALTA
                    : "";


            const percentual =
                item["%"] !== undefined
                    ? item["%"]
                    : item.PERCENTUAL !== undefined
                        ? item.PERCENTUAL
                        : "";


            const status =
                normalizar(item.STATUS);


            let classeLinha = "";
            let classeStatus = "";


            if (status === "PRODUZINDO") {

                classeLinha = "produzindo";
                classeStatus = "status-produzindo";

            }

            else if (status === "PROGRAMAR") {

                classeLinha = "programar";
                classeStatus = "status-programar";

            }

            else if (status === "FINALIZADO") {

                classeLinha = "finalizado";
                classeStatus = "status-finalizado";

            }

            else if (
                status === "PARADA" ||
                status === "PARADO"
            ) {

                classeLinha = "parada";
                classeStatus = "status-parada";

            }


            html += `

                <tr class="${classeLinha}">

                    <td>
                        ${formatarPercentual(percentual)}
                    </td>

                    <td class="codigo">
                        ${escapeHTML(codigo)}
                    </td>

                    <td class="falta">
                        ${formatarNumero(falta)}
                    </td>

                    <td class="status-text ${classeStatus}">
                        ${escapeHTML(status)}
                    </td>

                </tr>

            `;

        });


        /* completar linhas */

        for (
            let i = registros.length;
            i < 4;
            i++
        ) {

            html += `

                <tr class="sem-status">

                    <td>-</td>
                    <td></td>
                    <td>0</td>
                    <td></td>

                </tr>

            `;

        }

    }


    html += `

                </tbody>

            </table>

        </div>

    `;


    return html;

}


/* =====================================================
   FORMATAR NÚMERO
===================================================== */

function formatarNumero(valor) {

    if (
        valor === "" ||
        valor === null ||
        valor === undefined
    ) {
        return "";
    }


    const numero = Number(valor);


    if (isNaN(numero)) {
        return valor;
    }


    return numero.toLocaleString(
        "pt-BR",
        {
            maximumFractionDigits: 0
        }
    );

}


/* =====================================================
   FORMATAR %
===================================================== */

function formatarPercentual(valor) {

    if (
        valor === "" ||
        valor === null ||
        valor === undefined
    ) {
        return "-";
    }


    let numero = Number(valor);


    if (isNaN(numero)) {
        return valor;
    }


    /* Se vier como 0.82 transforma em 82% */

    if (numero <= 1 && numero !== 0) {
        numero = numero * 100;
    }


    return Math.round(numero) + "%";

}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escapeHTML(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   INICIAR
===================================================== */

carregarDados();


/* Atualiza a cada 1 minuto */

setInterval(
    carregarDados,
    60000
);

</script>

</body>
</html>
