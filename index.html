<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Programação e Produção</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #06101f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    .header {
      background: #111c30;
      border: 1px solid #263b5c;
      border-radius: 0 0 12px 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .titulo {
      font-size: 30px;
      font-weight: bold;
      color: #55a2ff;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: #b9c7dc;
      font-size: 13px;
    }

    .info-topo {
      display: flex;
      gap: 12px;
    }

    .info-box {
      min-width: 150px;
      padding: 10px 18px;
      border: 1px solid #30476b;
      border-radius: 12px;
      text-align: center;
      background: #101b30;
    }

    .info-label {
      color: #9fb0ca;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .info-value {
      color: #4d9aff;
      font-size: 22px;
      font-weight: bold;
    }

    .data-value {
      color: #12df72;
    }

    /* =========================
       INDICADORES
    ========================= */

    .indicadores {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      padding: 18px 0;
    }

    .card-indicador {
      background: #111c30;
      border: 1px solid #29466f;
      border-radius: 12px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .indicador-titulo {
      font-size: 13px;
      color: #d7e1ef;
      margin-bottom: 6px;
    }

    .indicador-numero {
      font-size: 28px;
      font-weight: bold;
    }

    .verde {
      color: #00df70;
    }

    .amarelo {
      color: #ffd000;
    }

    .vermelho {
      color: #ff4058;
    }

    .azul {
      color: #4b91ff;
    }

    .laranja {
      color: #ff9d19;
    }

    /* =========================
       LINHAS
    ========================= */

    .linha {
      margin-bottom: 14px;
    }

    .linha-titulo {
      background: #182640;
      border-top: 1px solid #29466f;
      border-bottom: 1px solid #29466f;
      padding: 11px 14px;
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .maquinas {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    /* =========================
       MÁQUINA
    ========================= */

    .maquina {
      background: #101b2e;
      border: 1px solid #29466f;
      border-radius: 8px;
      overflow: hidden;
      min-height: 195px;
    }

    .maquina-titulo {
      background: #91c47d;
      color: #07110a;
      text-align: center;
      font-weight: bold;
      padding: 10px 5px;
      font-size: 15px;
    }

    .cabecalho-tabela {
      display: grid;
      grid-template-columns: 16% 39% 22% 23%;
      background: #e3e7ed;
      color: #101010;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      padding: 5px 0;
    }

    .registro {
      display: grid;
      grid-template-columns: 16% 39% 22% 23%;
      min-height: 23px;
      border-bottom: 1px solid #30405a;
      align-items: center;
      text-align: center;
      font-size: 11px;
    }

    .registro:last-child {
      border-bottom: none;
    }

    .codigo {
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 3px;
    }

    .falta {
      color: #ffd000;
      font-weight: bold;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      font-weight: bold;
      font-size: 10px;
    }

    .status-PRODUZINDO {
      color: #00df70;
    }

    .status-PROGRAMAR {
      color: #ffd000;
    }

    .status-FINALIZADO {
      color: #ff4058;
    }

    .status-PARADA {
      color: #4b91ff;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1200px) {

      .indicadores {
        grid-template-columns: repeat(3, 1fr);
      }

      .maquinas {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 800px) {

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-topo {
        width: 100%;
      }

      .info-box {
        flex: 1;
      }

      .indicadores {
        grid-template-columns: repeat(2, 1fr);
      }

      .maquinas {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {

      .titulo {
        font-size: 22px;
      }

      .indicadores {
        grid-template-columns: 1fr;
      }

      .maquinas {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <div class="header">

    <div>
      <div class="titulo">
        🏭 CONTROLE DE PROGRAMAÇÃO E PRODUÇÃO
      </div>

      <div class="subtitulo">
        Painel Operacional • Atualização automática
      </div>
    </div>

    <div class="info-topo">

      <div class="info-box">
        <div class="info-label">
          TOTAL PRODUZIDO
        </div>

        <div class="info-value" id="totalProduzido">
          0
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">
          DATA
        </div>

        <div class="info-value data-value" id="dataAtual">
          -
        </div>
      </div>

    </div>

  </div>


  <!-- =========================
       INDICADORES
  ========================== -->

  <div class="indicadores">

    <!-- PEÇAS PRODUZINDO -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        🟢 PEÇAS PRODUZINDO
      </div>

      <div
        class="indicador-numero verde"
        id="pecasProduzindo">
        0
      </div>
    </div>


    <!-- PEÇAS A PROGRAMAR -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        🟡 PEÇAS A PROGRAMAR
      </div>

      <div
        class="indicador-numero amarelo"
        id="pecasProgramar">
        0
      </div>
    </div>


    <!-- PEÇAS FINALIZADAS -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        🔴 PEÇAS FINALIZADAS
      </div>

      <div
        class="indicador-numero vermelho"
        id="pecasFinalizadas">
        0
      </div>
    </div>


    <!-- MÁQUINAS ATIVAS -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        🔵 MÁQUINAS ATIVAS
      </div>

      <div
        class="indicador-numero azul"
        id="maquinasAtivas">
        0
      </div>
    </div>


    <!-- MÁQUINAS PARADAS -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        ⛔ MÁQUINAS PARADAS
      </div>

      <div
        class="indicador-numero azul"
        id="maquinasParadas">
        0
      </div>
    </div>


    <!-- MÁQUINAS A PROGRAMAR -->
    <div class="card-indicador">
      <div class="indicador-titulo">
        🟠 MÁQUINAS A PROGRAMAR
      </div>

      <div
        class="indicador-numero laranja"
        id="maquinasProgramar">
        0
      </div>
    </div>

  </div>


  <!-- =========================
       PAINEL
  ========================== -->

  <div id="painel">
    Carregando dados da produção...
  </div>


  <script>

    /* =====================================================
       ENDEREÇO DA API
    ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyWIWNnhcEOd2FXAetR0meo7juZzfMbWrd35VNlEOHIrnZYO3clXtfD7xz2cysq1FWJhQ/exec";


    /* =====================================================
       FORMATA NÚMEROS
    ===================================================== */

    function numero(valor) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {
        return 0;
      }

      const numero = Number(
        String(valor)
          .replace(/\./g, "")
          .replace(",", ".")
      );

      return isNaN(numero) ? 0 : numero;
    }


    /* =====================================================
       FORMATA DATA
    ===================================================== */

    function formatarData(data) {

      const agora = new Date();

      const dia = String(
        agora.getDate()
      ).padStart(2, "0");

      const mes = String(
        agora.getMonth() + 1
      ).padStart(2, "0");

      const ano = agora.getFullYear();

      return `${dia}/${mes}/${ano}`;
    }


    /* =====================================================
       NORMALIZA STATUS
    ===================================================== */

    function normalizarStatus(status) {

      if (
        status === null ||
        status === undefined
      ) {
        return "";
      }

      return String(status)
        .trim()
        .toUpperCase();
    }


    /* =====================================================
       ATUALIZA INDICADORES
    ===================================================== */

    function atualizarIndicadores(dados) {

      let pecasProduzindo = 0;
      let pecasProgramar = 0;
      let pecasFinalizadas = 0;

      let maquinasProduzindo = new Set();
      let maquinasParadas = new Set();
      let maquinasProgramar = new Set();


      dados.forEach(item => {

        const status =
          normalizarStatus(item.STATUS);

        const maquina =
          String(item.MAQUINA || "").trim();


        /* =========================
           PEÇAS
        ========================= */

        if (status === "PRODUZINDO") {
          pecasProduzindo++;
        }

        if (status === "PROGRAMAR") {
          pecasProgramar++;
        }

        if (status === "FINALIZADO") {
          pecasFinalizadas++;
        }


        /* =========================
           MÁQUINAS
        ========================= */

        if (maquina !== "") {

          if (status === "PRODUZINDO") {
            maquinasProduzindo.add(maquina);
          }

          if (status === "PARADA") {
            maquinasParadas.add(maquina);
          }

          if (status === "PROGRAMAR") {
            maquinasProgramar.add(maquina);
          }

        }

      });


      /* =================================================
         MÁQUINAS ATIVAS

         Uma máquina é considerada ativa se tiver
         pelo menos uma peça PRODUZINDO.
      ================================================= */

      document.getElementById(
        "maquinasAtivas"
      ).textContent =
        maquinasProduzindo.size;


      document.getElementById(
        "maquinasParadas"
      ).textContent =
        maquinasParadas.size;


      document.getElementById(
        "maquinasProgramar"
      ).textContent =
        maquinasProgramar.size;


      document.getElementById(
        "pecasProduzindo"
      ).textContent =
        pecasProduzindo;


      document.getElementById(
        "pecasProgramar"
      ).textContent =
        pecasProgramar;


      document.getElementById(
        "pecasFinalizadas"
      ).textContent =
        pecasFinalizadas;

    }


    /* =====================================================
       TOTAL PRODUZIDO
    ===================================================== */

    function calcularTotalProduzido(dados) {

      let total = 0;

      dados.forEach(item => {

        total += numero(
          item.PRODUZIDO
        );

      });

      document.getElementById(
        "totalProduzido"
      ).textContent =
        total.toLocaleString(
          "pt-BR",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    /* =====================================================
       CRIA UMA MÁQUINA
    ===================================================== */

    function criarMaquina(
      maquina,
      registros
    ) {

      const div =
        document.createElement("div");

      div.className = "maquina";


      /* CABEÇALHO DA MÁQUINA */

      const titulo =
        document.createElement("div");

      titulo.className =
        "maquina-titulo";

      titulo.textContent =
        "🏭 " + maquina;

      div.appendChild(titulo);


      /* CABEÇALHO DA TABELA */

      const cabecalho =
        document.createElement("div");

      cabecalho.className =
        "cabecalho-tabela";

      cabecalho.innerHTML = `
        <div>%</div>
        <div>CÓDIGO</div>
        <div>FALTA</div>
        <div>STATUS</div>
      `;

      div.appendChild(cabecalho);


      /* LINHAS */

      const quantidadeLinhas = 5;


      for (
        let i = 0;
        i < quantidadeLinhas;
        i++
      ) {

        const item =
          registros[i];


        const linha =
          document.createElement("div");

        linha.className =
          "registro";


      if (item) {

  const valorPercentual =
    item["%"] ??
    item.PERCENTUAL ??
    item.PORCENTAGEM ??
    "-";

  const percentual =
    valorPercentual !== "" &&
    valorPercentual !== null &&
    valorPercentual !== "-" &&
    !isNaN(Number(valorPercentual))
      ? (Number(valorPercentual) * 100).toFixed(0) + "%"
      : "-";


          const codigo =
           item["CÓDIGO"] ?? item["CODIGO"] ?? "-" ??
            "-";


          const falta =
            item.FALTA ??
            0;


          const status =
            normalizarStatus(
              item.STATUS
            );


          linha.innerHTML = `

            <div>
              ${percentual}
            </div>

            <div
              class="codigo"
              title="${codigo}">
              ${codigo}
            </div>

            <div class="falta">
              ${falta}
            </div>

            <div
              class="status status-${status}">
              ${status || "-"}
            </div>

          `;

        } else {

          linha.innerHTML = `

            <div>-</div>

            <div>-</div>

            <div class="falta">
              0
            </div>

            <div>-</div>

          `;

        }


        div.appendChild(linha);

      }


      return div;

    }


    /* =====================================================
       MONTA O PAINEL
    ===================================================== */

    function montarPainel(dados) {

      const painel =
        document.getElementById(
          "painel"
        );


      painel.innerHTML = "";


      /* =================================================
         AGRUPA POR LINHA
      ================================================= */

      const linhas = {};


      dados.forEach(item => {

        let linha =
          item.LINHA ||
          item.Linha ||
          item.LINHA_PRODUCAO ||
          "";


        linha =
          String(linha).trim();


        if (!linha) {
          linha = "SEM LINHA";
        }


        if (!linhas[linha]) {
          linhas[linha] = {};
        }


        const maquina =
          String(
            item.MAQUINA || ""
          ).trim();


        if (!maquina) {
          return;
        }


        if (!linhas[linha][maquina]) {
          linhas[linha][maquina] = [];
        }


        linhas[linha][maquina].push(item);

      });


      /* =================================================
         ORDENA AS LINHAS
      ================================================= */

      const nomesLinhas =
        Object.keys(linhas)
          .sort((a, b) =>
            a.localeCompare(
              b,
              "pt-BR",
              {
                numeric: true
              }
            )
          );


      nomesLinhas.forEach(
        nomeLinha => {

          const blocoLinha =
            document.createElement(
              "div"
            );

          blocoLinha.className =
            "linha";


          const tituloLinha =
            document.createElement(
              "div"
            );

          tituloLinha.className =
            "linha-titulo";

          tituloLinha.textContent =
            "🏭 " + nomeLinha;


          blocoLinha.appendChild(
            tituloLinha
          );


          const maquinas =
            document.createElement(
              "div"
            );

          maquinas.className =
            "maquinas";


          const nomesMaquinas =
            Object.keys(
              linhas[nomeLinha]
            ).sort(
              (a, b) => {

                const numA =
                  parseInt(
                    a.replace(/\D/g, "")
                  ) || 0;

                const numB =
                  parseInt(
                    b.replace(/\D/g, "")
                  ) || 0;

                return numA - numB;

              }
            );


          nomesMaquinas.forEach(
            nomeMaquina => {

              const maquina =
                criarMaquina(
                  nomeMaquina,
                  linhas[
                    nomeLinha
                  ][
                    nomeMaquina
                  ]
                );


              maquinas.appendChild(
                maquina
              );

            }
          );


          blocoLinha.appendChild(
            maquinas
          );


          painel.appendChild(
            blocoLinha
          );

        }
      );

    }


    /* =====================================================
       BUSCA DADOS
    ===================================================== */

    async function carregarDados() {

      try {

        const resposta =
          await fetch(
            API_URL + "?t=" +
            Date.now()
          );


        if (!resposta.ok) {
          throw new Error(
            "Erro HTTP: " +
            resposta.status
          );
        }


        const dados =
          await resposta.json();


        if (!Array.isArray(dados)) {

          throw new Error(
            "A API não retornou uma lista."
          );

        }


        /* ATUALIZA DATA */

        document.getElementById(
          "dataAtual"
        ).textContent =
          formatarData();


        /* INDICADORES */

        atualizarIndicadores(
          dados
        );


        /* TOTAL PRODUZIDO */

        calcularTotalProduzido(
          dados
        );


        /* PAINEL */

        montarPainel(
          dados
        );


      } catch (erro) {

        console.error(
          erro
        );


        document.getElementById(
          "painel"
        ).innerHTML = `

          <div style="
            padding:30px;
            text-align:center;
            color:#ff4058;
            background:#111c30;
            border:1px solid #29466f;
            border-radius:10px;
          ">

            ⚠️ Não foi possível
            carregar os dados da produção.

            <br><br>

            Verifique a conexão
            com a API.

          </div>

        `;

      }

    }


    /* =====================================================
       INICIA
    ===================================================== */

    carregarDados();


    /* =====================================================
       ATUALIZA AUTOMATICAMENTE
       A CADA 1 MINUTO
    ===================================================== */

    setInterval(
      carregarDados,
      60000
    );

  </script>

</body>
</html>
