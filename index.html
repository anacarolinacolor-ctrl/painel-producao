<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Painel da Produção</title>


<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #06111f;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 8px;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.cabecalho {

  width: 100%;

  min-height: 96px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  padding: 14px 22px;

  background:
    linear-gradient(
      135deg,
      #101d32,
      #0b1729
    );

  border: 1px solid #294a73;

  border-radius: 10px;

  margin-bottom: 10px;

}


.titulo-area {
  flex: 1;
}


.titulo {

  margin: 0;

  font-size: 30px;

  font-weight: 800;

  color: #f5f7fa;

  letter-spacing: 0.5px;

}


.subtitulo {

  margin-top: 5px;

  font-size: 13px;

  color: #cbd5e1;

}


/* =====================================================
   INDICADORES
===================================================== */

.indicadores {

  display: flex;

  gap: 10px;

}


.indicador {

  min-width: 190px;

  height: 72px;

  padding: 8px 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 12px;

  border-radius: 8px;

  background: #091625;

  border: 2px solid;

}


.indicador.verde {
  border-color: #00e676;
}

.indicador.vermelho {
  border-color: #ff2d3d;
}

.indicador.amarelo {
  border-color: #ffd000;
}


.indicador-icone {

  font-size: 27px;

}


.indicador-info {

  text-align: center;

}


.indicador-titulo {

  font-size: 12px;

  font-weight: bold;

  color: #ffffff;

  white-space: nowrap;

}


.indicador-numero {

  font-size: 28px;

  line-height: 30px;

  font-weight: 800;

}


.verde .indicador-numero {
  color: #00e676;
}

.vermelho .indicador-numero {
  color: #ff3548;
}

.amarelo .indicador-numero {
  color: #ffd000;
}


/* =====================================================
   DATA
===================================================== */

.data-box {

  min-width: 145px;

  height: 72px;

  padding: 8px 14px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background: #091625;

  border: 1px solid #294a73;

  border-radius: 8px;

}


.data-label {

  font-size: 11px;

  color: #dbeafe;

  font-weight: bold;

  margin-bottom: 5px;

}


.data-valor {

  font-size: 17px;

  color: #00e676;

  font-weight: 800;

}


/* =====================================================
   LINHAS
===================================================== */

.linha {

  margin-bottom: 10px;

}


.linha-titulo {

  height: 34px;

  display: flex;

  align-items: center;

  padding: 0 12px;

  background: #172a47;

  border: 1px solid #294a73;

  border-radius: 8px 8px 0 0;

  font-size: 17px;

  font-weight: 800;

  margin-bottom: 4px;

}


/* =====================================================
   GRID - 5 MÁQUINAS POR LINHA
===================================================== */

.maquinas {

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 6px;

}


/* =====================================================
   CARTÃO DA MÁQUINA
===================================================== */

.maquina {

  min-width: 0;

  min-height: 178px;

  background: #101d31;

  border: 1px solid #294a73;

  border-radius: 8px;

  overflow: hidden;

  transition: 0.2s;

}


/* CORES DA MÁQUINA */

.maquina.produzindo {

  border-color: #00e676;

  box-shadow:
    0 0 3px rgba(0,230,118,0.25);

}


.maquina.programar {

  border-color: #ffd000;

  box-shadow:
    0 0 3px rgba(255,208,0,0.25);

}


.maquina.parada {

  border-color: #ff2d3d;

  box-shadow:
    0 0 3px rgba(255,45,61,0.25);

}


.maquina.sem-status {

  border-color: #42536a;

}


/* =====================================================
   TÍTULO DA MÁQUINA
===================================================== */

.maquina-titulo {

  height: 38px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #172a47;

  border-bottom: 1px solid #294a73;

  font-size: 17px;

  font-weight: 800;

}


.maquina.produzindo
.maquina-titulo {

  color: #00e676;

}


.maquina.programar
.maquina-titulo {

  color: #ffd000;

}


.maquina.parada
.maquina-titulo {

  color: #ff3548;

}


/* =====================================================
   CONTEÚDO DA MÁQUINA
===================================================== */

.conteudo-maquina {

  padding: 8px;

}


/* =====================================================
   BLOCO DE CADA PEÇA
===================================================== */

.peca {

  background: #0d192b;

  border: 1px solid #294a73;

  border-radius: 7px;

  padding: 7px;

  margin-bottom: 6px;

}


.peca:last-child {

  margin-bottom: 0;

}


/* =====================================================
   PARTE SUPERIOR DA PEÇA
===================================================== */

.peca-topo {

  display: grid;

  grid-template-columns:
    minmax(0, 0.9fr)
    minmax(120px, 1.2fr)
    auto;

  align-items: center;

  gap: 8px;

}


.codigo-area {

  min-width: 0;

}


.label {

  font-size: 8px;

  color: #9ec5f5;

  margin-bottom: 3px;

  text-transform: uppercase;

}


.codigo {

  font-size: 13px;

  font-weight: 800;

  color: #ffffff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =====================================================
   STATUS
===================================================== */

.status {

  font-size: 10px;

  font-weight: 800;

  margin-top: 5px;

}


.status-PRODUZINDO {

  color: #00e676;

}


.status-PROGRAMAR {

  color: #ffd000;

}


.status-PARADA,
.status-PARADO {

  color: #ff3548;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progresso-area {

  min-width: 0;

}


.progresso-cabecalho {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 4px;

}


.progresso-label {

  font-size: 8px;

  color: #9ec5f5;

}


.progresso-percentual {

  font-size: 10px;

  font-weight: 800;

  color: #ffffff;

}


.barra {

  width: 100%;

  height: 12px;

  background: #273951;

  border: 1px solid #70839c;

  overflow: hidden;

}


.barra-progresso {

  height: 100%;

  width: 0%;

  transition: width 0.5s ease;

}


.barra-verde {

  background: #66b447;

}


.barra-amarela {

  background: #ffd000;

}


.barra-vermelha {

  background: #ff3548;

}


.barra-azul {

  background: #4d8df7;

}


/* =====================================================
   PRODUZIDO / FALTA
===================================================== */

.informacoes {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 5px;

  margin-top: 6px;

}


.info {

  background: #162844;

  border-radius: 5px;

  padding: 5px;

  text-align: center;

}


.info-label {

  font-size: 8px;

  color: #a9c6e8;

  margin-bottom: 2px;

}


.info-valor {

  font-size: 15px;

  font-weight: 800;

  line-height: 17px;

}


.info-falta {

  color: #ff3548;

}


.info-produzido {

  color: #ffffff;

}


/* =====================================================
   SEM PRODUÇÃO
===================================================== */

.sem-dados {

  min-height: 110px;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  color: #8da1bb;

  font-size: 12px;

  font-weight: 700;

}


/* =====================================================
   CARREGANDO
===================================================== */

.carregando {

  padding: 20px;

  text-align: center;

  color: #ffffff;

  font-size: 14px;

}


/* =====================================================
   ERRO
===================================================== */

.erro {

  margin: 20px;

  padding: 15px;

  border: 1px solid #ff3548;

  border-radius: 8px;

  color: #ff3548;

  background: #26121a;

  text-align: center;

}


/* =====================================================
   RESPONSIVIDADE
===================================================== */

@media (max-width: 1200px) {

  .indicador {

    min-width: 150px;

  }

  .titulo {

    font-size: 24px;

  }

}


@media (max-width: 900px) {

  .cabecalho {

    flex-wrap: wrap;

  }

  .indicadores {

    width: 100%;

  }

  .indicador {

    flex: 1;

    min-width: 0;

  }

  .data-box {

    min-width: 130px;

  }

  .maquinas {

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

  }

}


@media (max-width: 600px) {

  .maquinas {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

  }

  .peca-topo {

    grid-template-columns: 1fr;

  }

}


/* =====================================================
   TELA GRANDE / TV
===================================================== */

@media (min-width: 1600px) {

  body {

    padding: 10px;

  }

  .cabecalho {

    min-height: 92px;

  }

  .titulo {

    font-size: 32px;

  }

  .maquina {

    min-height: 185px;

  }

}


</style>

</head>


<body>


<!-- ==================================================
     CABEÇALHO
================================================== -->

<div class="cabecalho">


  <div class="titulo-area">

    <div class="titulo">
      🏭 PAINEL DA PRODUÇÃO
    </div>

    <div class="subtitulo">
      Painel Operacional
      <span>•</span>
      Atualização automática a cada 1 minuto
    </div>

  </div>


  <!-- INDICADORES -->

  <div class="indicadores">


    <div class="indicador verde">

      <div class="indicador-icone">
        📈
      </div>

      <div class="indicador-info">

        <div class="indicador-titulo">
          MÁQUINAS ATIVAS
        </div>

        <div
          class="indicador-numero"
          id="maquinasAtivas"
        >
          0
        </div>

      </div>

    </div>


    <div class="indicador vermelho">

      <div class="indicador-icone">
        🛑
      </div>

      <div class="indicador-info">

        <div class="indicador-titulo">
          MÁQUINAS PARADAS
        </div>

        <div
          class="indicador-numero"
          id="maquinasParadas"
        >
          0
        </div>

      </div>

    </div>


    <div class="indicador amarelo">

      <div class="indicador-icone">
        🕐
      </div>

      <div class="indicador-info">

        <div class="indicador-titulo">
          MÁQUINAS A PROGRAMAR
        </div>

        <div
          class="indicador-numero"
          id="maquinasProgramar"
        >
          0
        </div>

      </div>

    </div>


  </div>


  <!-- DATA -->

  <div class="data-box">

    <div class="data-label">
      📅 DATA
    </div>

    <div
      class="data-valor"
      id="dataAtual"
    >
      -
    </div>

  </div>


</div>


<!-- ==================================================
     ÁREA DAS LINHAS
================================================== -->

<div id="painel">

  <div class="carregando">
    Carregando dados da produção...
  </div>

</div>



<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let dadosProducao = [];



/* =====================================================
   NORMALIZAR STATUS
===================================================== */

function normalizarStatus(status) {

  if (
    status === null ||
    status === undefined
  ) {

    return "";

  }


  return String(status)
    .trim()
    .toUpperCase();

}



/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function numero(valor) {

  if (
    valor === null ||
    valor === undefined ||
    valor === ""
  ) {

    return 0;

  }


  if (typeof valor === "number") {

    return valor;

  }


  let texto =
    String(valor)
      .trim()
      .replace(/\./g, "")
      .replace(",", ".");


  let resultado =
    Number(texto);


  return isNaN(resultado)
    ? 0
    : resultado;

}



/* =====================================================
   PERCENTUAL
===================================================== */

function obterPercentual(item) {

  const produzido =
    numero(item.PRODUZIDO);


  const falta =
    numero(item.FALTA);


  /*
    Exemplo:

    Produzido = 1.917
    Falta = -8.083

    Total = 10.000

    1.917 / 10.000 = 19,17%
  */


  const total =
    produzido +
    Math.abs(falta);


  if (
    total <= 0
  ) {

    return 0;

  }


  let percentual =
    (produzido / total) * 100;


  if (
    percentual < 0
  ) {

    percentual = 0;

  }


  if (
    percentual > 100
  ) {

    percentual = 100;

  }


  return percentual;

}



/* =====================================================
   CLASSE DA MÁQUINA
===================================================== */

function classeMaquina(registros) {

  if (
    !registros ||
    registros.length === 0
  ) {

    return "sem-status";

  }


  /*
    Se houver PARADA,
    a máquina fica vermelha.
  */

  const parada =
    registros.some(function(item) {

      const status =
        normalizarStatus(
          item.STATUS
        );

      return (
        status === "PARADA" ||
        status === "PARADO"
      );

    });


  if (parada) {

    return "parada";

  }


  /*
    Se houver PROGRAMAR,
    fica amarela.
  */

  const programar =
    registros.some(function(item) {

      return (
        normalizarStatus(
          item.STATUS
        ) === "PROGRAMAR"
      );

    });


  if (programar) {

    return "programar";

  }


  /*
    Se estiver PRODUZINDO,
    fica verde.
  */

  const produzindo =
    registros.some(function(item) {

      return (
        normalizarStatus(
          item.STATUS
        ) === "PRODUZINDO"
      );

    });


  if (produzindo) {

    return "produzindo";

  }


  return "sem-status";

}



/* =====================================================
   CLASSE DA BARRA
===================================================== */

function classeBarra(
  percentual,
  status
) {

  status =
    normalizarStatus(status);


  if (
    status === "PROGRAMAR"
  ) {

    return "barra-amarela";

  }


  if (
    status === "PARADA" ||
    status === "PARADO"
  ) {

    return "barra-vermelha";

  }


  if (
    status === "PRODUZINDO"
  ) {

    return "barra-verde";

  }


  return "barra-azul";

}



/* =====================================================
   OBTER CÓDIGO
===================================================== */

function obterCodigo(item) {

  return (
    item["CÓDIGO"] ??
    item["CODIGO"] ??
    item["Código"] ??
    item["CÓDIGO DA PEÇA"] ??
    item["CODIGO DA PEÇA"] ??
    "-"
  );

}



/* =====================================================
   CRIAR PEÇA
===================================================== */

function criarPeca(item) {


  const status =
    normalizarStatus(
      item.STATUS
    );


  /*
    Só mostra peça quando
    o STATUS estiver preenchido.
  */

  if (!status) {

    return null;

  }


  const codigo =
    obterCodigo(item);


  const percentual =
    obterPercentual(item);


  const produzido =
    numero(
      item.PRODUZIDO
    );


  const falta =
    numero(
      item.FALTA
    );


  const barra =
    classeBarra(
      percentual,
      status
    );


  const peca =
    document.createElement("div");


  peca.className =
    "peca";


  peca.innerHTML = `

    <div class="peca-topo">


      <div class="codigo-area">

        <div class="label">
          CÓDIGO
        </div>

        <div
          class="codigo"
          title="${codigo}"
        >
          ${codigo}
        </div>

        <div
          class="status status-${status}"
        >
          ${status}
        </div>

      </div>


      <div class="progresso-area">

        <div class="progresso-cabecalho">

          <span class="progresso-label">
            PROGRESSO DA PRODUÇÃO
          </span>

          <span class="progresso-percentual">
            ${percentual.toFixed(0)}%
          </span>

        </div>


        <div class="barra">

          <div
            class="barra-progresso ${barra}"
            style="width:${percentual}%"
          ></div>

        </div>

      </div>


    </div>


    <div class="informacoes">


      <div class="info">

        <div class="info-label">
          PRODUZIDO
        </div>

        <div
          class="info-valor info-produzido"
        >
          ${produzido.toLocaleString("pt-BR")}
        </div>

      </div>


      <div class="info">

        <div class="info-label">
          FALTA
        </div>

        <div
          class="info-valor info-falta"
        >
          ${falta.toLocaleString("pt-BR")}
        </div>

      </div>


    </div>

  `;


  return peca;

}



/* =====================================================
   CRIAR MÁQUINA
===================================================== */

function criarMaquina(
  maquina,
  registros
) {


  const div =
    document.createElement("div");


  const classe =
    classeMaquina(
      registros
    );


  div.className =
    "maquina " +
    classe;


  /* CABEÇALHO */

  const titulo =
    document.createElement("div");


  titulo.className =
    "maquina-titulo";


  titulo.textContent =
    "🏭 " + maquina;


  div.appendChild(
    titulo
  );


  /* CONTEÚDO */

  const conteudo =
    document.createElement("div");


  conteudo.className =
    "conteudo-maquina";


  /*
    Só mantém registros
    que possuem STATUS.
  */

  const registrosValidos =
    registros.filter(function(item) {

      return normalizarStatus(
        item.STATUS
      ) !== "";

    });


  /*
    Cria todas as peças
    da máquina.
  */

  registrosValidos.forEach(
    function(item) {

      const peca =
        criarPeca(item);


      if (peca) {

        conteudo.appendChild(
          peca
        );

      }

    }
  );


  /*
    Caso não exista nenhuma
    peça com STATUS.
  */

  if (
    registrosValidos.length === 0
  ) {

    conteudo.innerHTML = `

      <div class="sem-dados">

        <div>
          SEM PRODUÇÃO
        </div>

        <div>
          COM STATUS
        </div>

      </div>

    `;

  }


  div.appendChild(
    conteudo
  );


  return div;

}



/* =====================================================
   OBTER NÚMERO DA MÁQUINA
===================================================== */

function numeroMaquina(maquina) {

  const texto =
    String(maquina);


  const encontrado =
    texto.match(/\d+/);


  if (!encontrado) {

    return 999;

  }


  return Number(
    encontrado[0]
  );

}



/* =====================================================
   OBTER LINHA
===================================================== */

function obterLinha(item) {

  /*
    Se a planilha possuir uma
    coluna LINHA, usamos ela.
  */

  if (
    item.LINHA !== undefined &&
    item.LINHA !== null &&
    String(item.LINHA).trim() !== ""
  ) {

    return String(
      item.LINHA
    ).trim();

  }


  if (
    item["LINHA"] !== undefined &&
    item["LINHA"] !== null &&
    String(item["LINHA"]).trim() !== ""
  ) {

    return String(
      item["LINHA"]
    ).trim();

  }


  /*
    Caso não exista coluna LINHA,
    fazemos automaticamente:

    M1 até M10  = LINHA 1
    M11 até M20 = LINHA 2
    M21 até M30 = LINHA 3
  */

  const maquina =
    item.MAQUINA ??
    item["MÁQUINA"] ??
    "";


  const numero =
    numeroMaquina(
      maquina
    );


  if (
    numero === 999
  ) {

    return "1";

  }


  return String(
    Math.ceil(
      numero / 10
    )
  );

}



/* =====================================================
   RENDERIZAR PAINEL
===================================================== */

function renderizarPainel(
  dados
) {


  const painel =
    document.getElementById(
      "painel"
    );


  painel.innerHTML = "";


  if (
    !dados ||
    dados.length === 0
  ) {

    painel.innerHTML = `

      <div class="erro">
        Nenhum dado encontrado na produção.
      </div>

    `;

    atualizarIndicadores(
      []
    );

    return;

  }


  /*
    Agrupa os dados por máquina.
  */

  const maquinasMap =
    {};


  dados.forEach(
    function(item) {


      const maquina =
        item.MAQUINA ??
        item["MÁQUINA"] ??
        item["Maquina"] ??
        "";


      if (
        String(maquina).trim() === ""
      ) {

        return;

      }


      const nomeMaquina =
        String(maquina).trim();


      if (
        !maquinasMap[nomeMaquina]
      ) {

        maquinasMap[nomeMaquina] =
          [];

      }


      maquinasMap[nomeMaquina]
        .push(item);

    }
  );


  /*
    Ordena máquinas.
  */

  const nomesMaquinas =
    Object.keys(
      maquinasMap
    ).sort(
      function(a, b) {

        return (
          numeroMaquina(a) -
          numeroMaquina(b)
        );

      }
    );


  /*
    Agrupa máquinas por linha.
  */

  const linhas =
    {};


  nomesMaquinas.forEach(
    function(maquina) {


      const registros =
        maquinasMap[maquina];


      const linha =
        obterLinha(
          registros[0]
        );


      if (
        !linhas[linha]
      ) {

        linhas[linha] =
          [];

      }


      linhas[linha].push(
        maquina
      );

    }
  );


  /*
    Ordena linhas.
  */

  const nomesLinhas =
    Object.keys(
      linhas
    ).sort(
      function(a, b) {

        const na =
          numeroMaquina(a);

        const nb =
          numeroMaquina(b);

        return na - nb;

      }
    );


  /*
    Cria cada linha.
  */

  nomesLinhas.forEach(
    function(nomeLinha) {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "linha";


      const titulo =
        document.createElement(
          "div"
        );


      titulo.className =
        "linha-titulo";


      titulo.textContent =
        "🏭 LINHA " +
        nomeLinha;


      linha.appendChild(
        titulo
      );


      const maquinas =
        document.createElement(
          "div"
        );


      maquinas.className =
        "maquinas";


      /*
        Mantém 5 máquinas
        por linha visual.
      */

      linhas[nomeLinha].forEach(
        function(nomeMaquina) {


          const registros =
            maquinasMap[
              nomeMaquina
            ];


          const maquina =
            criarMaquina(
              nomeMaquina,
              registros
            );


          maquinas.appendChild(
            maquina
          );

        }
      );


      linha.appendChild(
        maquinas
      );


      painel.appendChild(
        linha
      );

    }
  );


  atualizarIndicadores(
    dados
  );

}



/* =====================================================
   INDICADORES
===================================================== */

function atualizarIndicadores(
  dados
) {


  const maquinas =
    {};


  dados.forEach(
    function(item) {


      const maquina =
        item.MAQUINA ??
        item["MÁQUINA"] ??
        "";


      if (
        String(maquina).trim() === ""
      ) {

        return;

      }


      const nome =
        String(maquina).trim();


      if (
        !maquinas[nome]
      ) {

        maquinas[nome] =
          [];

      }


      maquinas[nome].push(
        item
      );

    }
  );


  let ativas = 0;

  let paradas = 0;

  let programar = 0;


  Object.keys(maquinas)
    .forEach(
      function(nome) {


        const registros =
          maquinas[nome];


        const classe =
          classeMaquina(
            registros
          );


        if (
          classe === "produzindo"
        ) {

          ativas++;

        }


        if (
          classe === "parada"
        ) {

          paradas++;

        }


        if (
          classe === "programar"
        ) {

          programar++;

        }

      }
    );


  document.getElementById(
    "maquinasAtivas"
  ).textContent =
    ativas;


  document.getElementById(
    "maquinasParadas"
  ).textContent =
    paradas;


  document.getElementById(
    "maquinasProgramar"
  ).textContent =
    programar;

}



/* =====================================================
   DATA
===================================================== */

function atualizarData() {


  const agora =
    new Date();


  const dia =
    String(
      agora.getDate()
    ).padStart(2, "0");


  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2, "0");


  const ano =
    agora.getFullYear();


  document.getElementById(
    "dataAtual"
  ).textContent =
    dia +
    "/" +
    mes +
    "/" +
    ano;

}



/* =====================================================
   CARREGAR DADOS
===================================================== */

function carregarDados() {


  atualizarData();


  /*
    Usa a função
    obterDadosProducao()
    do Código.gs
  */

  google.script.run

    .withSuccessHandler(
      function(resultado) {


        console.log(
          "Dados recebidos:",
          resultado
        );


        try {

          let dados =
            resultado;


          /*
            Caso a função retorne
            texto JSON.
          */

          if (
            typeof dados === "string"
          ) {

            dados =
              JSON.parse(
                dados
              );

          }


          if (
            !Array.isArray(
              dados
            )
          ) {

            throw new Error(
              "Formato de dados inválido."
            );

          }


          dadosProducao =
            dados;


          renderizarPainel(
            dados
          );


        }
        catch (erro) {

          console.error(
            erro
          );


          document.getElementById(
            "painel"
          ).innerHTML = `

            <div class="erro">
              Não foi possível interpretar os dados da produção.
            </div>

          `;

        }

      }
    )

    .withFailureHandler(
      function(erro) {


        console.error(
          "Erro ao carregar produção:",
          erro
        );


        document.getElementById(
          "painel"
        ).innerHTML = `

          <div class="erro">

            ⚠️ Não foi possível carregar
            os dados da produção.

            <br><br>

            Verifique a conexão com a API.

          </div>

        `;

      }
    )

    .obterDadosProducao();

}



/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    carregarDados();

  }
);



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

/*
  Atualiza o painel a cada 1 minuto.
*/

setInterval(
  function() {

    carregarDados();

  },
  60000
);


</script>
