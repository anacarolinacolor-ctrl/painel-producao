<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Programação e Produção</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #06101f;
      color: #ffffff;
    }

    .header {
      background: #111c31;
      border: 1px solid #263b5c;
      border-radius: 0 0 14px 14px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .titulo {
      font-size: 28px;
      font-weight: bold;
      color: #5da2ff;
    }

    .subtitulo {
      margin-top: 6px;
      font-size: 13px;
      color: #9fb0c8;
    }

    .info-topo {
      display: flex;
      gap: 12px;
    }

    .info-box {
      min-width: 150px;
      background: #111c31;
      border: 1px solid #304668;
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
    }

    .info-label {
      font-size: 12px;
      color: #9fb0c8;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 23px;
      font-weight: bold;
      color: #4d9aff;
      margin-top: 4px;
    }

    .data-value {
      color: #16d96b;
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 18px 0;
    }

    .card {
      background: #111c31;
      border: 1px solid #2a4164;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }

    .card-titulo {
      font-size: 13px;
      color: #b9c8dc;
    }

    .card-numero {
      font-size: 26px;
      font-weight: bold;
      margin-top: 4px;
    }

    .verde {
      color: #10d968;
    }

    .amarelo {
      color: #ffd21c;
    }

    .vermelho {
      color: #ff4558;
    }

    .azul {
      color: #4e96ff;
    }

    .linha {
      margin-bottom: 18px;
    }

    .linha-titulo {
      background: #18263f;
      border-top: 1px solid #2b4264;
      border-bottom: 1px solid #2b4264;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: bold;
      color: #e8eef8;
    }

    .maquinas {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 10px 7px;
    }

    .maquina {
      border: 1px solid #334c70;
      border-radius: 8px;
      overflow: hidden;
      background: #101b2e;
      min-height: 170px;
    }

    .maquina-titulo {
      background: #91c27b;
      color: #08120b;
      text-align: center;
      font-weight: bold;
      padding: 10px 4px;
      font-size: 15px;
    }

    .cabecalho-tabela {
      display: grid;
      grid-template-columns: 45px 1fr 65px 90px;
      background: #e5e8ed;
      color: #111827;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      padding: 5px 2px;
    }

    .registro {
      display: grid;
      grid-template-columns: 45px 1fr 65px 90px;
      min-height: 25px;
      border-bottom: 1px solid #2e405c;
      font-size: 11px;
      align-items: center;
    }

    .registro > div {
      text-align: center;
      padding: 5px 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .codigo {
      font-weight: bold;
    }

    .falta {
      color: #ffd21c;
      font-weight: bold;
    }

    .status {
      font-weight: bold;
    }

    .status-produzindo {
      color: #00dc68;
      background: rgba(0, 180, 110, 0.16);
    }

    .status-programar {
      color: #ffd21c;
      background: rgba(255, 205, 0, 0.15);
    }

    .status-finalizado {
      color: #ff4558;
    }

    .status-parada {
      color: #5b9cff;
      background: rgba(50, 120, 255, 0.12);
    }

    .sem-dados {
      color: #8997aa;
      text-align: center;
      padding: 25px 5px;
      font-size: 12px;
    }

    .carregando {
      text-align: center;
      padding: 35px;
      color: #8fa5c2;
      font-size: 15px;
    }

    .erro {
      margin: 20px;
      padding: 20px;
      background: #351923;
      border: 1px solid #a43852;
      border-radius: 10px;
      color: #ff9daf;
    }

    .rodape {
      text-align: center;
      color: #71829b;
      font-size: 11px;
      padding: 12px;
    }

    @media (max-width: 1100px) {
      .maquinas {
        grid-template-columns: repeat(3, 1fr);
      }

      .resumo {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-topo {
        width: 100%;
      }

      .info-box {
        flex: 1;
      }

      .maquinas {
        grid-template-columns: 1fr;
      }

      .resumo {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div>
      <div class="titulo">
        🏭 CONTROLE DE PROGRAMAÇÃO E PRODUÇÃO
      </div>

      <div class="subtitulo">
        Painel Operacional • Atualização automática
      </div>
    </div>

    <div class="info-topo">

      <div class="info-box">
        <div class="info-label">Total Produzido</div>
        <div class="info-value" id="totalProduzido">
          0
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">Data</div>
        <div class="info-value data-value" id="dataAtual">
          --
        </div>
      </div>

    </div>

  </div>


  <div class="resumo">

    <div class="card">
      <div class="card-titulo">🟢 PRODUZINDO</div>
      <div class="card-numero verde" id="qtdProduzindo">0</div>
    </div>

    <div class="card">
      <div class="card-titulo">🟡 PROGRAMAR</div>
      <div class="card-numero amarelo" id="qtdProgramar">0</div>
    </div>

    <div class="card">
      <div class="card-titulo">🔴 FINALIZADO</div>
      <div class="card-numero vermelho" id="qtdFinalizado">0</div>
    </div>

    <div class="card">
      <div class="card-titulo">🔵 PARADA</div>
      <div class="card-numero azul" id="qtdParada">0</div>
    </div>

  </div>


  <div id="painel">

    <div class="carregando">
      Carregando dados da produção...
    </div>

  </div>


  <div class="rodape">
    Última atualização: <span id="ultimaAtualizacao">--</span>
  </div>


<script>

  /* =====================================================
     URL DA SUA API GOOGLE APPS SCRIPT
     ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyWIWNnhcEOd2FXAetR0meo7juZzfMbWrd35VNlEOHIrnZYO3clXtfD7xz2cysq1FWJhQ/exec";


  /* =====================================================
     INICIALIZAÇÃO
     ===================================================== */

  carregarDados();


  /* Atualiza automaticamente a cada 1 minuto */

  setInterval(carregarDados, 60000);


  /* =====================================================
     BUSCAR DADOS
     ===================================================== */

  async function carregarDados() {

    try {

      const resposta = await fetch(API_URL + "?t=" + Date.now());

      if (!resposta.ok) {
        throw new Error(
          "Erro HTTP: " + resposta.status
        );
      }

      const dados = await resposta.json();

      console.log("Dados recebidos:", dados);

      processarDados(dados);

    }

    catch (erro) {

      console.error("Erro ao carregar API:", erro);

      document.getElementById("painel").innerHTML = `
        <div class="erro">
          <strong>⚠️ Não foi possível carregar os dados.</strong>
          <br><br>
          Verifique a conexão com o Google Apps Script.
          <br><br>
          <small>${erro.message}</small>
        </div>
      `;

    }

  }


  /* =====================================================
     PROCESSAR DADOS
     ===================================================== */

  function processarDados(dados) {

    if (!Array.isArray(dados)) {

      if (dados && Array.isArray(dados.dados)) {
        dados = dados.dados;
      }

      else if (dados && Array.isArray(dados.data)) {
        dados = dados.data;
      }

      else {
        console.error("Formato recebido:", dados);

        throw new Error(
          "A API não retornou uma lista de dados."
        );
      }

    }


    if (dados.length === 0) {

      document.getElementById("painel").innerHTML = `
        <div class="carregando">
          Nenhum dado encontrado.
        </div>
      `;

      return;
    }


    /* =====================================================
       DESCOBRIR NOMES DAS COLUNAS
       ===================================================== */

    const primeiro = dados[0];

    console.log(
      "Primeiro registro:",
      primeiro
    );


    /* =====================================================
       NORMALIZAR DADOS
       ===================================================== */

    const registros = dados.map(item => {

      return {

        linha:
          pegar(item,
            "LINHA",
            "Linha",
            "linha"
          ),

        maquina:
          pegar(item,
            "MAQUINA",
            "MÁQUINA",
            "Maquina",
            "Máquina",
            "maquina"
          ),

        codigo:
          pegar(item,
            "CODIGO",
            "CÓDIGO",
            "Codigo",
            "Código",
            "codigo"
          ),

        descricao:
          pegar(item,
            "DESCRICAO",
            "DESCRIÇÃO",
            "Descricao",
            "Descrição",
            "descricao"
          ),

        termino:
          pegar(item,
            "TERMINO",
            "TÉRMINO",
            "Termino",
            "Término",
            "termino"
          ),

        produzido:
          numero(
            pegar(item,
              "PRODUZIDO",
              "Produzido",
              "produzido"
            )
          ),

        falta:
          numero(
            pegar(item,
              "FALTA",
              "Falta",
              "falta"
            )
          ),

        status:
          pegar(item,
            "STATUS",
            "Status",
            "status"
          ),

        percentual:
          pegar(item,
            "%",
            "PERCENTUAL",
            "Percentual",
            "percentual"
          )

      };

    });


    montarPainel(registros);

  }


  /* =====================================================
     PEGAR VALOR DE UMA COLUNA
     ===================================================== */

  function pegar(obj, ...nomes) {

    for (const nome of nomes) {

      if (
        obj &&
        Object.prototype.hasOwnProperty.call(obj, nome)
      ) {

        return obj[nome];

      }

    }

    return "";

  }


  /* =====================================================
     CONVERTER PARA NÚMERO
     ===================================================== */

  function numero(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ""
    ) {
      return 0;
    }

    if (typeof valor === "number") {
      return valor;
    }

    let texto =
      String(valor)
        .replace(/\./g, "")
        .replace(",", ".");

    const n = Number(texto);

    return isNaN(n) ? 0 : n;

  }


  /* =====================================================
     MONTAR PAINEL
     ===================================================== */

  function montarPainel(registros) {

    const painel =
      document.getElementById("painel");

    painel.innerHTML = "";


    /* =====================================================
       RESUMO
       ===================================================== */

    let produzindo = 0;
    let programar = 0;
    let finalizado = 0;
    let parada = 0;

    let totalProduzido = 0;


    registros.forEach(r => {

      const status =
        String(r.status || "")
          .trim()
          .toUpperCase();

      totalProduzido += r.produzido;


      if (status === "PRODUZINDO") {
        produzindo++;
      }

      else if (status === "PROGRAMAR") {
        programar++;
      }

      else if (status === "FINALIZADO") {
        finalizado++;
      }

      else if (
        status === "PARADA" ||
        status === "PARADO"
      ) {
        parada++;
      }

    });


    document.getElementById(
      "qtdProduzindo"
    ).textContent = produzindo;


    document.getElementById(
      "qtdProgramar"
    ).textContent = programar;


    document.getElementById(
      "qtdFinalizado"
    ).textContent = finalizado;


    document.getElementById(
      "qtdParada"
    ).textContent = parada;


    document.getElementById(
      "totalProduzido"
    ).textContent =
      formatarNumero(totalProduzido);


    document.getElementById(
      "dataAtual"
    ).textContent =
      new Date().toLocaleDateString(
        "pt-BR"
      );


    document.getElementById(
      "ultimaAtualizacao"
    ).textContent =
      new Date().toLocaleTimeString(
        "pt-BR"
      );


    /* =====================================================
       AGRUPAR POR LINHA E MÁQUINA
       ===================================================== */

    const linhas = {};


    registros.forEach(r => {

      const linha =
        r.linha || "LINHA 1";

      const maquina =
        r.maquina || "SEM MÁQUINA";


      if (!linhas[linha]) {
        linhas[linha] = {};
      }


      if (!linhas[linha][maquina]) {
        linhas[linha][maquina] = [];
      }


      linhas[linha][maquina].push(r);

    });


    /* =====================================================
       ORDENAR LINHAS
       ===================================================== */

    const nomesLinhas =
      Object.keys(linhas).sort(
        compararNumeros
      );


    /* =====================================================
       CRIAR LINHAS
       ===================================================== */

    nomesLinhas.forEach(nomeLinha => {

      const blocoLinha =
        document.createElement("div");

      blocoLinha.className = "linha";


      blocoLinha.innerHTML = `
        <div class="linha-titulo">
          🏭 ${nomeLinha}
        </div>
      `;


      const maquinas =
        document.createElement("div");

      maquinas.className = "maquinas";


      const nomesMaquinas =
        Object.keys(
          linhas[nomeLinha]
        ).sort(compararNumeros);


      nomesMaquinas.forEach(nomeMaquina => {

        maquinas.appendChild(

          criarMaquina(
            nomeMaquina,
            linhas[nomeLinha][nomeMaquina]
          )

        );

      });


      blocoLinha.appendChild(maquinas);

      painel.appendChild(blocoLinha);

    });

  }


  /* =====================================================
     CRIAR CARD DA MÁQUINA
     ===================================================== */

  function criarMaquina(
    nomeMaquina,
    registros
  ) {

    const maquina =
      document.createElement("div");

    maquina.className = "maquina";


    let html = `

      <div class="maquina-titulo">
        🏭 ${nomeMaquina}
      </div>

      <div class="cabecalho-tabela">
        <div>%</div>
        <div>CÓDIGO</div>
        <div>FALTA</div>
        <div>STATUS</div>
      </div>

    `;


    if (
      !registros ||
      registros.length === 0
    ) {

      html += `
        <div class="sem-dados">
          Sem programação
        </div>
      `;

    }


    else {

      registros.forEach(r => {

        const status =
          String(r.status || "")
            .trim()
            .toUpperCase();


        let classeStatus = "";


        if (
          status === "PRODUZINDO"
        ) {
          classeStatus =
            "status-produzindo";
        }

        else if (
          status === "PROGRAMAR"
        ) {
          classeStatus =
            "status-programar";
        }

        else if (
          status === "FINALIZADO"
        ) {
          classeStatus =
            "status-finalizado";
        }

        else if (
          status === "PARADA" ||
          status === "PARADO"
        ) {
          classeStatus =
            "status-parada";
        }


        html += `

          <div class="registro">

            <div>
              ${formatarPercentual(
                r.percentual
              )}
            </div>

            <div class="codigo"
                 title="${escapeHtml(
                   r.descricao || ""
                 )}">
              ${escapeHtml(
                r.codigo || "-"
              )}
            </div>

            <div class="falta">
              ${formatarNumero(
                r.falta
              )}
            </div>

            <div class="status ${classeStatus}">
              ${escapeHtml(
                r.status || "-"
              )}
            </div>

          </div>

        `;

      });

    }


    maquina.innerHTML = html;


    return maquina;

  }


  /* =====================================================
     FORMATAR PERCENTUAL
     ===================================================== */

  function formatarPercentual(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ""
    ) {
      return "-";
    }


    if (
      typeof valor === "string" &&
      valor.includes("%")
    ) {

      return valor;

    }


    const n =
      Number(
        String(valor)
          .replace(",", ".")
      );


    if (isNaN(n)) {
      return "-";
    }


    if (n <= 1) {
      return Math.round(n * 100) + "%";
    }


    return Math.round(n) + "%";

  }


  /* =====================================================
     FORMATAR NÚMERO
     ===================================================== */

  function formatarNumero(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ""
    ) {
      return "0";
    }


    const n = Number(valor);


    if (isNaN(n)) {
      return String(valor);
    }


    return n.toLocaleString(
      "pt-BR",
      {
        maximumFractionDigits: 2
      }
    );

  }


  /* =====================================================
     ESCAPAR HTML
     ===================================================== */

  function escapeHtml(valor) {

    return String(valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     ORDENAR LINHAS/MÁQUINAS
     ===================================================== */

  function compararNumeros(a, b) {

    const na =
      parseInt(
        String(a).match(/\d+/)?.[0] || "999"
      );

    const nb =
      parseInt(
        String(b).match(/\d+/)?.[0] || "999"
      );

    return na - nb;

  }

</script>

</body>
</html>
